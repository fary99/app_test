  <line x1="14.5" y1="28" x2="19" y2="28" stroke="#9ad9e3" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="37" y1="28" x2="41.5" y2="28" stroke="#9ad9e3" stroke-width="1.4" stroke-linecap="round"/>
